<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Iron Baron — an 8-bit railroad business simulation." />
    <title>Iron Baron</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23120f1c'/%3E%3Crect x='1' y='2' width='5' height='3' fill='%23a6463a'/%3E%3Crect x='5' y='1' width='1' height='1' fill='%23ece6d6'/%3E%3Crect x='1' y='5' width='2' height='2' fill='%23f2c84a'/%3E%3Crect x='4' y='5' width='2' height='2' fill='%23f2c84a'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="world" aria-label="Game map. Right-drag to pan, mouse wheel to zoom."></canvas>

      <header id="topbar">
        <div class="brand" aria-label="Iron Baron">IRON BARON</div>
        <div class="date" id="date" aria-live="polite">—</div>
        <div class="money" data-tip="Company cash" id="cash-wrap"><span class="label" id="company"></span><span id="cash">$0</span></div>
        <button class="btn stock" id="stock" data-tip="Your company's share price (change over the last month) — click for the stock window" aria-label="Share price"></button>
        <button class="btn money personal" id="personal" data-tip="Your personal net worth (cash + shares) — click for your portfolio" aria-label="Personal net worth"></button>
        <button class="btn goal" id="goal" hidden data-tip="Scenario goal and medals — click for details" aria-label="Scenario goal"></button>
        <div class="speed" role="group" aria-label="Game speed" id="speed"></div>
        <button class="btn econ" id="econ" aria-label="Economic report"></button>
        <div class="news" id="news" aria-live="polite"></div>
        <div class="seed" id="seed"></div>
        <button class="btn" id="btn-new" data-tip="Main menu — continue, tutorial, scenarios, new map, load" data-key="Esc"></button>
        <button class="btn" id="btn-save" data-tip="Save & load — saves, export, import" data-key="Ctrl+S quick save"></button>
        <button class="btn" id="btn-settings" data-tip="Settings — sound, interface size, hints, autosave"></button>
        <button class="btn" id="btn-help" data-tip="Help & controls" data-key="H"></button>
      </header>

      <nav id="rail" aria-label="Tools"></nav>

      <aside id="panel">
        <section class="card" id="inspector" aria-live="polite"></section>
        <section class="card" id="minimap-card">
          <div class="card-title">Overview</div>
          <canvas id="minimap" width="256" height="134" aria-label="Overview map. Click to move the view."></canvas>
        </section>
      </aside>

      <div id="status"></div>
      <div id="tooltip" role="tooltip" hidden></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
